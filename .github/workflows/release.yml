name: Release

on:
  push:
    tags:
      - "v*"
  # 手动触发：可以用来提前检查release的打包情况
  workflow_dispatch:

# Release builds are heavier than CI — let them finish, don't cancel.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 1. Frontend build — produces web/dist that every Rust job consumes.
  # ─────────────────────────────────────────────────────────────────────
  web:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install npm dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Upload web/dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # 2. Build matrix — one job per platform, all apps in one archive.
  #    每个平台一个压缩包，包含该平台全部二进制：
  #      Windows : qshare.exe（GUI，内嵌图标）+ qshare-cli.exe + qshare-tui.exe
  #      macOS   : q-share.app（GUI bundle）+ qshare-cli + qshare-tui
  #      Linux   : qshare-cli + qshare-tui（iced/wgpu 在 Linux CI 上不可靠）
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: build (${{ matrix.target }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            apps: cli tui
            archive: tar.xz
          - target: x86_64-apple-darwin
            os: macos-latest
            apps: cli tui gui
            archive: tar.xz
          - target: aarch64-apple-darwin
            os: macos-latest
            apps: cli tui gui
            archive: tar.xz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            apps: cli tui gui
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/qshare-core
            crates/qshare-cli
            crates/qshare-tui
            crates/qshare-gui
            crates/qshare-assets

      - name: Download web/dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      # 逐个构建该平台需要的包。qshare-assets 在编译期嵌入 web/dist，
      # 所以每个 app 都自带前端资源；cargo 增量缓存让后几个包很快。
      - name: cargo build --release
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p qshare-cli --target ${{ matrix.target }}
          cargo build --release --locked -p qshare-tui --target ${{ matrix.target }}
          if [[ " ${{ matrix.apps }} " == *" gui "* ]]; then
            cargo build --release --locked -p qshare-gui --target ${{ matrix.target }}
          fi

      # 把所有二进制（和 macOS 的 .app bundle）放进 dist/，再整体打包。
      # macOS GUI 必须打成 .app（Info.plist + AppIcon.icns + ad-hoc 签名），
      # 否则 Dock/访达没有图标；Windows GUI 的图标由 build.rs 内嵌进 exe。
      - name: Stage binaries
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          [[ "${{ matrix.os }}" == "windows-latest" ]] && exe=".exe"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/qshare-cli$exe" "dist/qshare-cli$exe"
          cp "target/${{ matrix.target }}/release/qshare-tui$exe" "dist/qshare-tui$exe"
          if [[ " ${{ matrix.apps }} " == *" gui "* ]]; then
            if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
              bundle="dist/q-share.app"
              mkdir -p "$bundle/Contents/MacOS" "$bundle/Contents/Resources"
              sed -e "s/@VERSION@/${GITHUB_REF_NAME#v}/g" \
                  -e "s/@YEAR@/$(date +%Y)/g" \
                  packaging/Info.plist > "$bundle/Contents/Info.plist"
              cp "target/${{ matrix.target }}/release/qshare" "$bundle/Contents/MacOS/qshare"
              cp crates/qshare-gui/assets/icon.icns "$bundle/Contents/Resources/AppIcon.icns"
              codesign --force --deep --sign - "$bundle"
            else
              cp "target/${{ matrix.target }}/release/qshare$exe" "dist/qshare$exe"
            fi
          fi
          ls -la dist

      - name: Smoke test (--version)
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          [[ "${{ matrix.os }}" == "windows-latest" ]] && exe=".exe"
          for b in qshare-cli qshare-tui; do
            if [[ -f "dist/$b$exe" ]]; then
              ./dist/$b$exe --version
            fi
          done
          if [[ -d "dist/q-share.app" ]]; then
            ./dist/q-share.app/Contents/MacOS/qshare --version
          elif [[ -f "dist/qshare$exe" ]]; then
            ./dist/qshare$exe --version
          fi

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ARCHIVE_NAME="${{ github.event.repository.name }}-${{ matrix.target }}"
          if [[ "${{ matrix.archive }}" == "tar.xz" ]]; then
            ext="tar.xz"
            tar -cJf "${ARCHIVE_NAME}.${ext}" ./*
          else
            # zip on Windows
            ext="zip"
            7z.exe a "${ARCHIVE_NAME}.${ext}" . > /dev/null
          fi
          echo "ASSET=${ARCHIVE_NAME}.${ext}" >> "$GITHUB_ENV"
          ls -la

      - name: Upload artifact (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: q-share-${{ matrix.target }}
          path: dist/${{ env.ASSET }}
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # 3. Publish GitHub Release with all archives + checksums.
  # ─────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    # 手动触发（workflow_dispatch）只验证打包产物，不创建 Release——
    # 没有 git tag 时 softprops/action-gh-release 会失败。
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts

      - name: Flatten archives into one directory
        run: |
          mkdir -p release-assets
          find artifacts -maxdepth 2 -type f \( -name "*.tar.xz" -o -name "*.zip" \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -- * > SHA256SUMS
          else
            shasum -a 256 -- * > SHA256SUMS
          fi
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*
          fail_on_unmatched_files: false
