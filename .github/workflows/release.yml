name: Release

on:
  push:
    tags:
      - "v*"
  # 手动触发：可以用来提前检查release的打包情况
  workflow_dispatch:

# Release builds are heavier than CI — let them finish, don't cancel.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 1. Frontend build — produces web/dist that every Rust job consumes.
  # ─────────────────────────────────────────────────────────────────────
  web:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install npm dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Upload web/dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # 2. Build matrix — every binary on every platform we ship.
  #    CLI  : Linux + macOS (x86_64 + aarch64) + Windows
  #    TUI  : same
  #    GUI  : macOS + Windows only (iced/wgpu on Linux CI is GPU-unreliable)
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: build (${{ matrix.label }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── CLI ──
          - label: qshare-cli / x86_64-unknown-linux-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: qshare-cli
            archive: tar.xz
          - label: qshare-cli / x86_64-apple-darwin
            os: macos-latest
            target: x86_64-apple-darwin
            bin: qshare-cli
            archive: tar.xz
          - label: qshare-cli / aarch64-apple-darwin
            os: macos-latest
            target: aarch64-apple-darwin
            bin: qshare-cli
            archive: tar.xz
          - label: qshare-cli / x86_64-pc-windows-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: qshare-cli.exe
            archive: zip

          # ── TUI ──
          - label: qshare-tui / x86_64-unknown-linux-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: qshare-tui
            archive: tar.xz
          - label: qshare-tui / x86_64-apple-darwin
            os: macos-latest
            target: x86_64-apple-darwin
            bin: qshare-tui
            archive: tar.xz
          - label: qshare-tui / aarch64-apple-darwin
            os: macos-latest
            target: aarch64-apple-darwin
            bin: qshare-tui
            archive: tar.xz
          - label: qshare-tui / x86_64-pc-windows-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: qshare-tui.exe
            archive: zip

          # ── GUI (macOS + Windows only) ──
          - label: qshare / x86_64-apple-darwin
            os: macos-latest
            target: x86_64-apple-darwin
            bin: qshare
            archive: tar.xz
          - label: qshare / aarch64-apple-darwin
            os: macos-latest
            target: aarch64-apple-darwin
            bin: qshare
            archive: tar.xz
          - label: qshare / x86_64-pc-windows-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: qshare.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/qshare-core
            crates/qshare-cli
            crates/qshare-tui
            crates/qshare-gui
            crates/qshare-assets

      - name: Download web/dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      # Map bin → package. CLI = qshare-cli, TUI = qshare-tui, GUI = qshare-gui.
      # Windows 的 bin 带 .exe 后缀（qshare-cli.exe），先去掉再匹配。
      - name: cargo build --release
        shell: bash
        run: |
          bin="${{ matrix.bin }}"
          bin="${bin%.exe}"
          case "$bin" in
            qshare-cli) PKG=qshare-cli ;;
            qshare-tui) PKG=qshare-tui ;;
            qshare)     PKG=qshare-gui ;;
            *) echo "unknown bin ${{ matrix.bin }}"; exit 1 ;;
          esac
          cargo build --release --locked -p "$PKG" --target ${{ matrix.target }}

      # macOS GUI ships as a proper .app bundle — a bare binary has no icon
      # in the Dock/Finder. Assemble q-share.app (Info.plist + AppIcon.icns),
      # ad-hoc sign it, and stage the bundle. Everything else stays a bare
      # binary (CLI/TUI, or Windows GUI which uses the embedded .ico).
      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "${{ matrix.os }}" == "macos-latest" && "${{ matrix.bin }}" == "qshare" ]]; then
            bundle="dist/q-share.app"
            mkdir -p "$bundle/Contents/MacOS" "$bundle/Contents/Resources"
            sed -e "s/@VERSION@/${GITHUB_REF_NAME#v}/g" \
                -e "s/@YEAR@/$(date +%Y)/g" \
                packaging/Info.plist > "$bundle/Contents/Info.plist"
            cp "target/${{ matrix.target }}/release/qshare" "$bundle/Contents/MacOS/qshare"
            cp crates/qshare-gui/assets/icon.icns "$bundle/Contents/Resources/AppIcon.icns"
            codesign --force --deep --sign - "$bundle"
          else
            cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/
          fi

      - name: Smoke test (--version)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.os }}" == "macos-latest" && "${{ matrix.bin }}" == "qshare" ]]; then
            ./dist/q-share.app/Contents/MacOS/qshare --version
          else
            ./dist/${{ matrix.bin }} --version
          fi

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ARCHIVE_NAME="${{ github.event.repository.name }}-${{ matrix.target }}"
          if [[ "${{ matrix.os }}" == "macos-latest" && "${{ matrix.bin }}" == "qshare" ]]; then
            tar -cJf "${ARCHIVE_NAME}.tar.xz" q-share.app
            echo "ASSET=${ARCHIVE_NAME}.tar.xz" >> "$GITHUB_ENV"
          elif [[ "${{ matrix.archive }}" == "tar.xz" ]]; then
            tar -cJf "${ARCHIVE_NAME}.tar.xz" "${{ matrix.bin }}"
            echo "ASSET=${ARCHIVE_NAME}.tar.xz" >> "$GITHUB_ENV"
          else
            # zip on Windows
            7z.exe a "${ARCHIVE_NAME}.zip" "${{ matrix.bin }}" > /dev/null
            echo "ASSET=${ARCHIVE_NAME}.zip" >> "$GITHUB_ENV"
          fi

      - name: Upload artifact (for debugging)
        uses: actions/upload-artifact@v4
        with:
          # matrix.label 含斜杠，artifact 名不允许，改用 bin-target（无斜杠）
          name: ${{ matrix.bin }}-${{ matrix.target }}
          path: dist/${{ env.ASSET }}
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # 3. Publish GitHub Release with all archives + checksums.
  # ─────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    # 手动触发（workflow_dispatch）只验证打包产物，不创建 Release——
    # 没有 git tag 时 softprops/action-gh-release 会失败。
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts

      - name: Flatten archives into one directory
        run: |
          mkdir -p release-assets
          find artifacts -maxdepth 2 -type f \( -name "*.tar.xz" -o -name "*.zip" \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -- * > SHA256SUMS
          else
            shasum -a 256 -- * > SHA256SUMS
          fi
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*
          fail_on_unmatched_files: false
