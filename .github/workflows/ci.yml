name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight CI for the same ref when a new push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 1. Format check + clippy on Linux (single thread, fastest feedback).
  # ─────────────────────────────────────────────────────────────────────
  lint:
    name: fmt + clippy (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/qshare-core
            crates/qshare-cli
            crates/qshare-tui
            crates/qshare-gui
            crates/qshare-assets
          cache-on-failure: true

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ─────────────────────────────────────────────────────────────────────
  # 2. Build the frontend once (Linux), cache web/dist for downstream jobs.
  # ─────────────────────────────────────────────────────────────────────
  web:
    name: Build frontend (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install npm dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Upload web/dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # 3. Test matrix (Linux + macOS + Windows).
  # ─────────────────────────────────────────────────────────────────────
  test:
    name: test (${{ matrix.os }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/qshare-core
            crates/qshare-cli
            crates/qshare-tui
            crates/qshare-gui
            crates/qshare-assets

      - name: Download web/dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: cargo test
        run: cargo test --workspace --locked --all-targets

  # ─────────────────────────────────────────────────────────────────────
  # 4. CLI release build matrix — verify the shipped artifact actually
  #    starts on every target platform.
  # ─────────────────────────────────────────────────────────────────────
  build-cli:
    name: build qshare cli (${{ matrix.os }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.xz
            asset_name: qshare-x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.xz
            asset_name: qshare-x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.xz
            asset_name: qshare-aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            asset_name: qshare-x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/qshare-core
            crates/qshare-cli
            crates/qshare-tui
            crates/qshare-gui
            crates/qshare-assets

      - name: Download web/dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: cargo build --release
        run: cargo build --release --locked -p qshare-cli --target ${{ matrix.target }}

      - name: Smoke test (--version)
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/qshare${{ matrix.os == 'windows-latest' && '.exe' || '' }}"
          "$BIN" --version

      - name: Smoke test (help)
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/qshare${{ matrix.os == 'windows-latest' && '.exe' || '' }}"
          "$BIN" --help | head -20

      - name: Upload qshare binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            target/${{ matrix.target }}/release/qshare
            target/${{ matrix.target }}/release/qshare.exe
          if-no-files-found: error
          retention-days: 14